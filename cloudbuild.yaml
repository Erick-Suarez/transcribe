steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/transcribe-app:$COMMIT_SHA', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/transcribe-app:$COMMIT_SHA']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'transcribe'
    - '--image'
    - 'gcr.io/$PROJECT_ID/transcribe-app:$COMMIT_SHA'
    - '--region'
    - 'us-west2'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--port'
    - '8080'

images:
  - 'gcr.io/$PROJECT_ID/transcribe-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY 